# notes 拡張が見せる文言（日本語）。
#
# トップレベルのキーは拡張名 `notes` ただ 1 つ（コアのロケールカタログ規約）。
# 文言を足すときは en.yaml にも同じキーを入れること。

notes:
  tool:
    unexpected_error: "ノートのツール {tool} で想定外のエラー"
  alert:
    large_deletion: "ノート `{path}` で {removed} 行が消えました（+{added} / -{removed}、コミット `{commit}`）。差分を添付します。"
    large_deletion_files: "ノートの {files} ファイルで合わせて {removed} 行が消えました（+{added} / -{removed}、コミット `{commit}`）。差分を添付します。"
    patch_truncated: "（長いため以降を省略しました）"
