# Strings shown by the notes extension (English).
#
# The only top-level key is the extension name `notes` (core locale catalog rule).
# When adding a string, add the same key to ja.yaml too.

notes:
  tool:
    unexpected_error: "Unexpected error in notes tool {tool}"
  alert:
    large_deletion: "{removed} lines were removed from note `{path}` (+{added} / -{removed}, commit `{commit}`). The diff is attached."
    patch_truncated: "(truncated because it is too long)"
