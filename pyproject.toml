[project]
name = "lilla-core"
version = "0.5.0"
description = "Core runtime of the Lilla agent"
readme = "README.md"
license = "MIT"
authors = [
  { name = "tettekai" },
]
requires-python = ">=3.12"
keywords = ["ai", "agent", "discord", "llm", "bot"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Communications :: Chat",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "aiohttp==3.11.14",
  "discord.py==2.4.0",
  "pyyaml==6.0.2",
  "python-dotenv==1.0.1",
  "apscheduler==3.11.0",
  "pydantic==2.11.1",
  "pydantic-settings==2.8.1",
  "motor==3.7.0",
  "tiktoken==0.9.0",
  "bcrypt==5.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest==9.0.2",
  "pytest-asyncio==1.3.0",
]

[project.urls]
Homepage = "https://github.com/tettekai/lilla-core"
Repository = "https://github.com/tettekai/lilla-core"
Issues = "https://github.com/tettekai/lilla-core/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# lilla_core 配下の非 Python ファイル（locales/*.yaml の UI 文言カタログ）も
# そのまま wheel に含まれる
packages = ["src/lilla_core"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
