[project]
name = "lilla-core"
version = "0.9.0"
description = "Core runtime of the Lilla agent"
readme = "README.md"
license = "MIT"
authors = [
  { name = "tettekai" },
]
requires-python = ">=3.12"
keywords = ["ai", "agent", "discord", "llm", "bot"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.14",
  "Topic :: Communications :: Chat",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "aiohttp==3.14.5",
  "discord.py==2.7.1",
  "pyyaml==6.0.3",
  "python-dotenv==1.2.4",
  "apscheduler==3.11.3",
  "pydantic==2.14.3",
  "pydantic-settings==2.16.2",
  "pymongo==4.19.0",
  "tiktoken==0.14.0",
  "bcrypt==5.0.0",
  "dulwich==1.2.21",
  "jinja2==3.1.6",
]

[project.optional-dependencies]
dev = [
  "pytest==9.2.0",
  "pytest-asyncio==1.4.1.post1",
  "ruff==0.17.6",
]

[tool.ruff]
# サポートする最低版（requires-python）に合わせ、3.12 で使えない構文を拾う
target-version = "py312"

[tool.ruff.lint]
# 最初は控えめに、ruff の基本ルール（構文エラー・import・未使用など）だけにする
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# 拡張の読み込み（load_extensions）を他の import より先に行う必要があるため
"src/lilla_core/bot.py" = ["E402"]

[project.urls]
Homepage = "https://github.com/tettekai/lilla-core"
Repository = "https://github.com/tettekai/lilla-core"
Issues = "https://github.com/tettekai/lilla-core/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# lilla_core 配下の非 Python ファイル（locales/*.yaml の UI 文言カタログ）も
# そのまま wheel に含まれる
packages = ["src/lilla_core"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
