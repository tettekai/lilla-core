name: Notify Grok Bot auto-now

# Ping Grok Bot's "lilla auto-now" routine when the auto-now label is added
# to an Issue. GitHub native webhooks cannot set the Authorization header
# Grok Bot requires, so Actions POSTs instead (same pattern as
# notify-grok-bot-review.yml). Grok Bot removes the auto-now label itself,
# so this workflow never touches labels.
on:
  issues:
    types: [labeled]

jobs:
  notify:
    if: github.event.label.name == 'auto-now'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
    steps:
      - name: Notify Grok Bot
        env:
          WEBHOOK_URL: ${{ secrets.GROK_BOT_AUTO_NOW_WEBHOOK_URL }}
          WEBHOOK_AUTHORIZATION: ${{ secrets.GROK_BOT_AUTO_NOW_WEBHOOK_AUTHORIZATION }}
          OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          HTML_URL: ${{ github.event.issue.html_url }}
          USER_LOGIN: ${{ github.event.sender.login }}
        run: |
          set -euo pipefail

          if [ -z "${WEBHOOK_URL}" ] || [ -z "${WEBHOOK_AUTHORIZATION}" ]; then
            echo "Missing GROK_BOT_AUTO_NOW_WEBHOOK_URL or GROK_BOT_AUTO_NOW_WEBHOOK_AUTHORIZATION" >&2
            exit 1
          fi

          jq -n \
            --arg owner "${OWNER}" \
            --arg repo "${REPO_NAME}" \
            --arg repository "${REPOSITORY}" \
            --argjson issue_number "${ISSUE_NUMBER}" \
            --arg html_url "${HTML_URL}" \
            --arg user_login "${USER_LOGIN}" \
            '{action:"auto-now", owner:$owner, repo:$repo, repository:$repository, issue_number:$issue_number, html_url:$html_url, user_login:$user_login, label:"auto-now"}' \
            > /tmp/event.json

          curl -fsS -X POST "${WEBHOOK_URL}" \
            -H "Authorization: ${WEBHOOK_AUTHORIZATION}" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/event.json
